<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Pegawai — PPh 21 System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body>
<div class="app"><div class="main">
  <div class="content">
    <div class="page-head"><div class="page-head__row">
      <div>
        <h1>Data Pegawai</h1>
        <p>Kelola dan pantau seluruh pegawai — yang masih aktif maupun sudah tidak bekerja. Pegawai nonaktif tetap masuk rekapan tahunan namun penghasilannya tidak lagi dapat diinput.</p>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="exportBtn"></button>
      <button class="btn btn--primary" id="addBtn"></button>
    </div></div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <div class="card__head">
        <h3>Daftar Pegawai</h3>
        <div class="spacer"></div>
        <span class="pill pill--teal" id="shownCount"></span>
      </div>

      <div class="card__body" style="padding-bottom:4px">
        <div class="filter-bar">
          <div class="filter-seg" id="statusFilter">
            <button data-s="all" class="active">Semua</button>
            <button data-s="aktif">Aktif</button>
            <button data-s="nonaktif">Nonaktif</button>
          </div>
          <div class="filter-field">
            <label>PTKP</label>
            <select id="ptkpFilter"><option value="all">Semua PTKP</option></select>
          </div>
          <div class="filter-field">
            <label>Tampilkan</label>
            <select id="pageSize">
              <option value="10">10 pegawai</option>
              <option value="25">25 pegawai</option>
              <option value="50" selected>50 pegawai</option>
              <option value="all">Semua</option>
            </select>
          </div>
          <div class="filter-field filter-field--grow">
            <label>Cari</label>
            <input id="search" placeholder="Cari nama, jabatan, atau NIK…">
          </div>
        </div>
      </div>

      <div class="card__body card__body--flush">
        <div class="table-wrap">
          <table class="grid" id="grid">
            <thead><tr>
              <th>No</th><th>Nama / NIK</th><th>Jabatan</th><th>PTKP</th>
              <th>Gross Up</th><th>Masa Kerja</th><th>Status</th><th style="text-align:right">Aksi</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div></div>

<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/reference.js"></script>
<script src="../../assets/js/seed-data.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/engine.js"></script>
<script src="../../assets/js/ui.js"></script>
<script src="pegawai.js"></script>
</body>
</html>
